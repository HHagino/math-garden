project:
  type: website
  output-dir: docs
  render:
    - "index.qmd"
    - "記事/*.md"

website:
  title: "数学解説の庭"
  description: "ひとつの定理を、別の景色から見直すための解説集 — Hiromasa Hagino"
  # ⚠️ 2026-09-16：出力を65ページ数えたら meta タグが4本しか無かった。
  #    og も description も出ていない＝共有しても何も出ず、検索の説明文も自動生成任せだった。
  site-url: "https://hhagino.github.io/math-garden/"
  open-graph: true
  twitter-card: true
  page-navigation: true
  back-to-top-navigation: true
  reader-mode: true
  search: true
  navbar:
    background: light
    left:
      - href: index.qmd
        text: 庭
  page-footer:
    center: "© 2026 Hiromasa Hagino · CC BY 4.0"

format:
  html:
    theme:
      light: cosmo
      dark: solar
    css: styles.css
    toc: true
    toc-depth: 3
    toc-location: right
    # ⚠️ 2026-09-16：既定では katex@latest を読んでいた（出力にしか現れないので grep では出ない）。
    #    ★ 版が上がった日に、こちらが何もしていなくても数式が壊れうる。
    #    latest の実体は 0.18.7（実測）。そこへ固定＝今の挙動をそのまま凍結する。
    html-math-method:
      method: katex
      url: "https://cdn.jsdelivr.net/npm/katex@0.18.7/dist/"
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true
    fontsize: 1.05em
    linestretch: 1.7

lang: ja

execute:
  freeze: false
