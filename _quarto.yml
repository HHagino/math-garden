project:
  type: website
  output-dir: docs
  render:
    - "index.qmd"
    - "記事/*.md"

website:
  title: "数学解説の庭"
  description: "ひとつの定理を、別の景色から見直すための解説集 — Hiromasa Hagino"
  page-navigation: true
  back-to-top-navigation: true
  reader-mode: true
  search: true
  navbar:
    background: light
    left:
      - href: index.qmd
        text: 庭
  page-footer:
    center: "© 2026 Hiromasa Hagino · CC BY 4.0"

format:
  html:
    theme:
      light: cosmo
      dark: solar
    css: styles.css
    toc: true
    toc-depth: 3
    toc-location: right
    html-math-method: katex
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true
    fontsize: 1.05em
    linestretch: 1.7

lang: ja

execute:
  freeze: false
