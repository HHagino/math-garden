project:
  type: website
  output-dir: docs
  render:
    - "index.qmd"
    - "記事/*.md"
    - "この庭の作り方.md"
  # 2026-10-21：教科書（単体の HTML・MathJax）は Quarto で組まず、そのまま docs/教科書/ へ写す（萩野「推しは全部 Yes」）
  resources:
    - "教科書/**"
  # 2026-10-22：sitemap.xml は Quarto が「組んだ頁」だけで作る（resources で写した 教科書/ は載らない）。
  #   Quarto の sitemap の更新のあとに走る post-render で、docs/教科書/ の HTML を書き足す。
  post-render:
    - _sitemap_textbooks.ts

website:
  title: "数学解説の庭"
  description: "ひとつの定理を、別の景色から見直すための解説集 — Hiromasa Hagino"
  # ⚠️ 2026-09-16：出力を65ページ数えたら meta タグが4本しか無かった。
  #    og も description も出ていない＝共有しても何も出ず、検索の説明文も自動生成任せだった。
  site-url: "https://hhagino.github.io/math-garden/"
  # 2026-10-22：<link rel="icon"> が無く、ブラウザが https://hhagino.github.io/favicon.ico（サイトの外の根）を引いて 404 だった。
  #   docs/ の根に favicon.ico を置いても、引かれるのは /math-garden/ の外なので効かない。Quarto の website.favicon で link を出す。
  favicon: favicon.svg
  open-graph: true
  twitter-card: true
  page-navigation: true
  back-to-top-navigation: true
  reader-mode: true
  search: true
  navbar:
    background: light
    left:
      - href: index.qmd
        text: 庭
      - href: 教科書/index.html
        text: 教科書
      - href: この庭の作り方.md
        text: この庭の作り方
  page-footer:
    center: "© 2026 Hiromasa Hagino · CC BY 4.0"

format:
  html:
    theme:
      light: [cosmo, garden-light.scss]
      dark: [cosmo, garden-dark.scss]
    grid:
      body-width: 700px
    css: styles.css
    toc: true
    toc-depth: 3
    toc-location: right
    # ⚠️ 2026-09-16：既定では katex@latest を読んでいた（出力にしか現れないので grep では出ない）。
    #    ★ 版が上がった日に、こちらが何もしていなくても数式が壊れうる。
    #    latest の実体は 0.18.7（実測）。そこへ固定＝今の挙動をそのまま凍結する。
    html-math-method:
      method: katex
      url: "https://cdn.jsdelivr.net/npm/katex@0.18.7/dist/"
    # ⚠️ 2026-10-14：pandoc の KaTeX の描画ループは macros を空で呼ぶので、KaTeX に無い \Sha が
    #    赤字の「\Sha」のまま出ていた（4ページ39か所）。サイト全体のマクロをここで足す（中身はファイルの冒頭に）。
    include-in-header:
      - _fonts.html
      - _katex-macros.html
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true
    linestretch: 1.8
    filters:
      - _filters/garden.lua

lang: ja

execute:
  freeze: false
