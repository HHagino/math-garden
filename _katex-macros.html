<script>
/* 庭の KaTeX に、サイト全体のマクロを足す（2026-10-14）。
 * 理由：pandoc が出す KaTeX の描画ループは macros を空（var macros = []）で呼ぶので、
 *   KaTeX に無い \Sha が赤字の「\Sha」のまま出ていた（当時の記事4本で39か所）。
 *   記事の本文の \Sha は書き換えない（MathJax の教科書と同じ書き方のまま通す）。
 * 仕組み：katex.min.js は defer で読まれ、DOMContentLoaded の前に実行される。
 *   window の capture の段の DOMContentLoaded は、document に付いた pandoc のループより先に走る
 *   （置かれた順に関係なく）ので、ここで katex.render を包み、渡された macros に既定の定義を足す。
 *   渡された macros の入れ物はそのまま使う（\gdef が描画をまたいで残る KaTeX の動きを変えない）。
 *   Quarto の Quarto.typesetMath（脚注・相互参照の吹き出し）も katex.render を呼ぶので、同じく効く。
 * 足すときはここの GARDEN_KATEX_MACROS に1行足す。MathJax に切り替えたときは何もしない。
 */
(function () {
  var GARDEN_KATEX_MACROS = {
    "\\Sha": "\\text{\u0428}"   /* Ш（キリル文字の大文字 Sha）。教科書の MathJax の \unicode{x0428} と同じ字 */
  };
  window.addEventListener("DOMContentLoaded", function () {
    var k = window.katex;
    if (!k || typeof k.render !== "function" || k.__gardenMacros) return;
    var render = k.render;
    var has = Object.prototype.hasOwnProperty;
    k.render = function (tex, el, opts) {
      opts = opts || {};
      var m = opts.macros || {};
      for (var name in GARDEN_KATEX_MACROS) {
        if (has.call(GARDEN_KATEX_MACROS, name) && !has.call(m, name)) {
          m[name] = GARDEN_KATEX_MACROS[name];
        }
      }
      opts.macros = m;
      return render.call(this, tex, el, opts);
    };
    k.__gardenMacros = true;
  }, true);
})();
</script>
