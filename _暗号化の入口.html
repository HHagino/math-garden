<!DOCTYPE html>
<!--
  _暗号化の入口.html — StaticCrypt 3.5.4 の入口（パスワードを入れる画面）の型。2026-11-22。
  元＝staticrypt 3.5.4 の lib/password_template.html。日本語の短い案内にし、lang="ja"・noindex・「この端末で覚える」を最初から入れにした。
  /*[|...|]*/0 の所は staticrypt が埋める（暗号文・salt・復号の JS）。ここに記事の中身は入らない。
-->
<html lang="ja" class="staticrypt-html">

        <meta charset="utf-8" />
        <title>数学解説の庭</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow" />

        <meta http-equiv="pragma" content="no-cache" />

        <style>
            :root {
                --bg: #f2f4f7;
                --surface: #ffffff;
                --ink: #162030;
                --muted: #4f5a6b;
                --line: #d2d9e3;
                --field: #f7f8fa;
                --accent: #1d58a0;
                --on-accent: #ffffff;
                --focus: #ffd43d;
                --font-body: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0e131a;
                    --surface: #161d27;
                    --ink: #e5eaf1;
                    --muted: #a3aebd;
                    --line: #2b3645;
                    --field: #0e131a;
                    --accent: #86b4ee;
                    --on-accent: #0e131a;
                    color-scheme: dark;
                }
            }
            * {
                box-sizing: border-box;
            }
            .staticrypt-html {
                height: 100%;
            }
            .staticrypt-body {
                height: 100%;
                margin: 0;
                background: var(--bg);
                color: var(--ink);
                font-family: var(--font-body);
                font-size: 1rem;
                line-height: 1.75;
                letter-spacing: 0.02em;
            }
            .staticrypt-content {
                min-height: 100%;
                padding: 48px 16px 64px;
            }
            .staticrypt-page {
                max-width: 26em;
                margin: 0 auto;
            }
            .staticrypt-form {
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 24px 16px;
            }
            .staticrypt-title {
                margin: 0 0 8px;
                font-size: 1.5rem;
                line-height: 1.4;
            }
            .staticrypt-instructions p {
                margin: 0 0 16px;
            }
            .staticrypt-password-container {
                position: relative;
                margin: 0 0 16px;
            }
            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                width: 100%;
                min-height: 48px;
                padding: 12px 52px 12px 12px;
                font-size: 16px;
                font-family: inherit;
                color: var(--ink);
                background: var(--field);
                border: 1px solid var(--muted);
                border-radius: 6px;
            }
            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 48px;
                height: 48px;
                padding: 14px;
                opacity: 0.7;
            }
            @media (prefers-color-scheme: dark) {
                .staticrypt-toggle-password-visibility {
                    filter: invert(1);
                }
            }
            label.staticrypt-remember {
                display: flex;
                align-items: center;
                gap: 12px;
                min-height: 44px;
                margin: 0 0 16px;
            }
            .staticrypt-remember input[type="checkbox"] {
                width: 22px;
                height: 22px;
                margin: 0;
            }
            .staticrypt-decrypt-button {
                width: 100%;
                min-height: 48px;
                border: 0;
                border-radius: 6px;
                background: var(--accent);
                color: var(--on-accent);
                font-family: inherit;
                font-size: 1rem;
                font-weight: 700;
                cursor: pointer;
            }
            .staticrypt-decrypt-button:hover {
                filter: brightness(92%);
            }
            :focus-visible {
                outline: 4px solid var(--focus);
                outline-offset: 2px;
                box-shadow: 0 0 0 2px #000000;
            }
            .staticrypt-note {
                margin: 16px 0 0;
                color: var(--muted);
                font-size: 0.875rem;
                line-height: 1.6;
            }
            .hidden {
                display: none !important;
            }
            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>

                        <input type="submit" class="staticrypt-decrypt-button" value="開く" />
                    </form>
                    <p class="staticrypt-note">一度入れると、このブラウザでは次から入れずに読めます。</p>
                </div>
            </main>
        </div>

        <script>
            // these variables will be filled when generating the file - the template format is '/*[|variable_name|]*/0'
            const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
            const templateError = "パスワードが違います。",
                templateToggleAltShow = "パスワードを表示",

                staticryptConfig = /*[|staticrypt_config|]*/ 0;

            const templateConfig = {
                rememberExpirationKey: "staticrypt_expiration",
                rememberPassphraseKey: "staticrypt_passphrase",
                replaceHtmlCallback: null,
                clearLocalStorageCallback: null,
            };

            // init the staticrypt engine
            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            // try to automatically decrypt on load if there is a saved password
            window.onload = async function () {
                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();

                // if we didn't decrypt anything on load, show the password prompt. Otherwise the content has already been
                // replaced, no need to do anything
                if (!isSuccessful) {
                    // hide loading screen
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();

                    // show the remember me checkbox
                    if (isRememberEnabled) {
                        document.getElementById("staticrypt-remember-label").classList.remove("hidden");
                    }

            const imgSrcEyeOpened =
                "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1NzYgNTEyIj48IS0tIUZvbnQgQXdlc29tZSBGcmVlIDYuNS4yIGJ5IEBmb250YXdlc29tZSAtIGh0dHBzOi8vZm9udGF3ZXNvbWUuY29tIExpY2Vuc2UgLSBodHRwczovL2ZvbnRhd2Vzb21lLmNvbS9saWNlbnNlL2ZyZWUgQ29weXJpZ2h0IDIwMjQgRm9udGljb25zLCBJbmMuLS0+PHBhdGggZD0iTTI4OCAzMmMtODAuOCAwLTE0NS41IDM2LjgtMTkyLjYgODAuNkM0OC42IDE1NiAxNy4zIDIwOCAyLjUgMjQzLjdjLTMuMyA3LjktMy4zIDE2LjcgMCAyNC42QzE3LjMgMzA0IDQ4LjYgMzU2IDk1LjQgMzk5LjRDMTQyLjUgNDQzLjIgMjA3LjIgNDgwIDI4OCA0ODBzMTQ1LjUtMzYuOCAxOTIuNi04MC42YzQ2LjgtNDMuNSA3OC4xLTk1LjQgOTMtMTMxLjFjMy4zLTcuOSAzLjMtMTYuNyAwLTI0LjZjLTE0LjktMzUuNy00Ni4yLTg3LjctOTMtMTMxLjFDNDMzLjUgNjguOCAzNjguOCAzMiAyODggMzJ6TTE0NCAyNTZhMTQ0IDE0NCAwIDEgMSAyODggMCAxNDQgMTQ0IDAgMSAxIC0yODggMHptMTQ0LTY0YzAgMzUuMy0yOC43IDY0LTY0IDY0Yy03LjEgMC0xMy45LTEuMi0yMC4zLTMuM2MtNS41LTEuOC0xMS45IDEuNi0xMS43IDcuNGMuMyA2LjkgMS4zIDEzLjggMy4yIDIwLjdjMTMuNyA1MS4yIDY2LjQgODEuNiAxMTcuNiA2Ny45czgxLjYtNjYuNCA2Ny45LTExNy42Yy0xMS4xLTQxLjUtNDcuOC02OS40LTg4LjYtNzEuMWMtNS44LS4yLTkuMiA2LjEtNy40IDExLjdjMi4xIDYuNCAzLjMgMTMuMiAzLjMgMjAuM3oiLz48L3N2Zz4=";

                const passwordInput = document.getElementById("staticrypt-password");
                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    toggleIcon.src = imgSrcEyeOpened;
                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;
                } else {
                    passwordInput.type = "password";
                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;

            // handle password form submission
            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const password = document.getElementById("staticrypt-password").value,

</html>
