                :root {

                    --ink: #e5eaf1;
                    --muted: #a3aebd;
                    --line: #2b3645;
                    --field: #0e131a;

            }
            * {

            }
            .staticrypt-html {
                height: 100%;

            .staticrypt-body {
                height: 100%;

                background: var(--bg);
                color: var(--ink);
                font-family: var(--font-body);
                font-size: 1rem;
                line-height: 1.75;
                letter-spacing: 0.02em;
            }
            .staticrypt-content {
                min-height: 100%;
                padding: 48px 16px 64px;
            }
            .staticrypt-page {
                max-width: 26em;
                margin: 0 auto;
            }
            .staticrypt-form {
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 24px 16px;
            }
            .staticrypt-title {
                margin: 0 0 8px;
                font-size: 1.5rem;
                line-height: 1.4;
            }
            .staticrypt-instructions p {
                margin: 0 0 16px;
            }
            .staticrypt-password-container {
                position: relative;
                margin: 0 0 16px;
            }
            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                width: 100%;
                min-height: 48px;
                padding: 12px 52px 12px 12px;
                font-size: 16px;
                font-family: inherit;
                color: var(--ink);
                background: var(--field);
                border: 1px solid var(--muted);
                border-radius: 6px;
            }
            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 48px;
                height: 48px;
                padding: 14px;
                opacity: 0.7;

                min-height: 44px;
                margin: 0 0 16px;
            }
            .staticrypt-remember input[type="checkbox"] {
                width: 22px;
                height: 22px;
                margin: 0;
            }
            .staticrypt-decrypt-button {
                width: 100%;
                min-height: 48px;
                border: 0;
                border-radius: 6px;
                background: var(--accent);
                color: var(--on-accent);
                font-family: inherit;
                font-size: 1rem;
                font-weight: 700;
                cursor: pointer;
            }
            .staticrypt-decrypt-button:hover {
                filter: brightness(92%);
            }
            :focus-visible {
                outline: 4px solid var(--focus);
                outline-offset: 2px;
                box-shadow: 0 0 0 2px #000000;
            }
            .staticrypt-note {
                margin: 16px 0 0;
                color: var(--muted);
                font-size: 0.875rem;
                line-height: 1.6;
            }
            .hidden {
                display: none !important;
            }
            .staticrypt-spinner-container {
                height: 100%;

                align-items: center;
                justify-content: center;

                height: 2rem;

                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                if (!isSuccessful) {
                    alert(templateError);
                }
            });
        </script>
