<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>数学解説の庭（改装中）</title>
<link rel="icon" href="/math-garden/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#F2F4F7;--surface:#FFFFFF;--ink:#162030;--muted:#4F5A6B;--line:#D2D9E3;--accent:#1D58A0;--focus:#FFD43D;--focus-inner:#000000;
 --font-body:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E131A;--surface:#161D27;--ink:#E5EAF1;--muted:#A3AEBD;--line:#2B3645;--accent:#86B4EE;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E131A;--surface:#161D27;--ink:#E5EAF1;--muted:#A3AEBD;--line:#2B3645;--accent:#86B4EE;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.75;letter-spacing:.02em}
.page{max-width:43em;margin:0 auto;padding:48px 16px 64px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
h1{margin:0;font-size:1.75rem;line-height:1.4;letter-spacing:.01em;text-wrap:balance}
p{margin:0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
a{color:var(--accent);text-decoration-line:underline;text-underline-offset:3px;overflow-wrap:anywhere}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:4px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 2px var(--focus-inner);border-radius:4px}
.small{color:var(--muted);font-size:.875rem;line-height:1.6}
</style>
</head>
<body>
<main class="page" lang="ja">
<h1>数学解説の庭（改装中）</h1>
<div class="box">
<p>いま、この庭を作り直しています。そのあいだ、記事と教科書はお休みにしています。</p>
<p>再開したときは、このページと著者ページでお知らせします。</p>
<p><a href="https://hhagino.github.io/">著者ページ（Hiromasa Hagino）へ</a></p>
</div>
<p class="small">A garden of mathematical exposition (in Japanese): under renovation. It will reopen; see the <a href="https://hhagino.github.io/">author page</a> for news.</p>
</main>
</body>
</html>
